name: "Circular dependency detection"
description: "Validates that build dependencies forming a cycle are detected and fail"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - prod
    builds:
      - name: service-a
        triggers:
          - "services/a/**"
        depends_on:
          - service-b
      - name: service-b
        triggers:
          - "services/b/**"
        depends_on:
          - service-c
      - name: service-c
        triggers:
          - "services/c/**"
        depends_on:
          - service-a

  commits:
    - message: "feat: add services with circular dependencies"
      files:
        services/a/main.go: |
          package main
          func main() { println("Service A") }
        services/b/main.go: |
          package main
          func main() { println("Service B") }
        services/c/main.go: |
          package main
          func main() { println("Service C") }

trigger:
  workflow: orchestrate.yaml
  event: push

expect:
  workflow:
    conclusion: failure
