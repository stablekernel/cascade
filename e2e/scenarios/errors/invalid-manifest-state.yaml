name: "Invalid manifest state"
description: "Validates error handling when manifest has corrupted or invalid state"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - prod
    builds:
      - name: app
        triggers:
          - "src/**"

  commits:
    - message: "feat: add application"
      files:
        src/main.go: |
          package main

          func main() {
              println("Hello")
          }
    - message: "chore: corrupt manifest"
      files:
        .github/manifest.json: |
          {
            "invalid": "missing required fields",
            "malformed": true,
            "builds": "should be an object not a string"
          }

trigger:
  workflow: orchestrate.yaml
  event: push

expect:
  workflow:
    conclusion: failure
