name: "No-environment with malformed state structure"
description: "Validates error when no-env manifest has flat state (state.sha) instead of nested (state.prerelease.sha)"

setup:
  config:
    trunk_branch: main
    environments: []  # No environments - library/CLI project
    builds:
      - name: cli
        triggers:
          - "cmd/**"

  commits:
    - message: "feat: CLI feature"
      files:
        cmd/main.go: |
          package main

          func main() {
              println("CLI")
          }

  # MALFORMED: state at root level instead of under prerelease key
  # This is the bug that broke production - state.sha instead of state.prerelease.sha
  manifest:
    ci:
      state:
        sha: "abc123"
        version: "v1.0.0-rc.0"
        committed_at: "2024-01-01T00:00:00Z"
        committed_by: "system"

trigger:
  workflow: promote.yaml
  event: workflow_dispatch
  inputs:
    mode: "release"

expect:
  workflow:
    conclusion: failure
