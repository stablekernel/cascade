name: "Release trigger dispatch-only"
description: |
  Verifies at runtime that release_trigger: dispatch makes the generated
  orchestrate workflow run only on workflow_dispatch. A maintainer-owned gate
  (for example a nightly schedule) then decides when a release candidate is cut,
  instead of every trunk merge cutting one.

  Runtime assertion. The same orchestrate workflow is run twice: under a push
  event it schedules no job (the push: trigger is gone), and under a
  workflow_dispatch event it runs and advances dev state to the first release
  candidate. Running the dispatch path proves the workflow_dispatch trigger is
  genuinely wired, which a grep for the "workflow_dispatch:" string cannot
  establish, and the no-run push assertion proves the trigger was suppressed
  rather than merely spelled differently in the on: block. The default (push)
  behavior for repositories that do not set release_trigger is covered by every
  other generator scenario.

config:
  trunk_branch: main
  release_trigger: dispatch
  environments: [dev]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys: []

steps:
  - name: "Initial commit"
    action: commit
    commit:
      message: "feat: add app"
      files:
        src/app.go: |
          package main
          func main() {}

  - name: "A push event triggers no orchestrate run"
    action: orchestrate
    orchestrate:
      event: push
      expect_no_run: true

  - name: "A workflow_dispatch event runs orchestrate and advances state"
    action: orchestrate
    orchestrate:
      event: workflow_dispatch
    expect:
      state:
        dev:
          sha: commit1
          version: "v0.1.0-rc.0"
      jobs:
        build-app: success
