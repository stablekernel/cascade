name: "State Push Retry Loop"
description: |
  Verifies the generated orchestrate.yaml's Update Manifest step runs its
  fetch+reset+reapply+push retry loop (#101) at runtime instead of a single git
  push.

  Runtime assertion. An orchestrate run advances dev state and the executed
  finalize job logs the loop's success marker "cascade-state-write: ok
  attempt=1". That marker is emitted only by the running loop, so it disappears
  if the loop is replaced by a bare push, whereas a grep of the emitted script
  source would stay green because the marker text is still literally present in
  the file. Reproducing the actual concurrent-push 409 race needs real GHA and
  stays a fleet concern.

  The Contents-API branch of the same step (real GitHub only, so it cannot
  execute under act/gitea) is asserted on the emitted workflow instead: the PUT
  always carries the CAS sha and refuses to write when the manifest has no blob
  at the fetched tip, and the retry loop classifies failures, retrying a 409
  conflict but failing fast on any other 4xx instead of relabeling revoked
  tokens or missing branches as "likely concurrent run" for ten attempts.

config:
  trunk_branch: main
  environments: [dev]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys: []

steps:
  - name: "Initial commit"
    action: commit
    commit:
      message: "feat: add app"
      files:
        src/app.go: |
          package main
          func main() {}
    expect:
      workflow_files:
        - path: ".github/workflows/orchestrate.yaml"
          contains:
            # The Contents-API PUT refuses to write without a base blob rather
            # than degrading to an sha-less create-or-overwrite.
            - 'if [[ -z "$BASE_SHA" ]]; then'
            - "refusing an unguarded state write"
            # The CAS sha rides in the argument list unconditionally.
            - '-f "sha=$BASE_SHA"'
            # PUT failures are classified: 409 retries, other 4xx fail fast.
            - '*"HTTP 409"*'
            - "cascade-state-write: permanent-error attempt=$attempt"
          not_contains:
            # The old branch that omitted the CAS sha on an empty base.
            - 'if [[ -n "$BASE_SHA" ]]; then'
            # The old blanket relabeling of every PUT failure as concurrency.
            - "State write attempt $attempt failed (likely concurrent run)"

  - name: "Orchestrate; assert the retry loop ran and wrote state"
    action: orchestrate
    expect:
      # State advanced: the Update Manifest loop reached its push and committed
      # the new leaf. A regressed loop that never pushes leaves this unchanged.
      state:
        dev:
          sha: commit1
          version: "v0.1.0-rc.0"
      jobs:
        build-app: success
      # The running loop's success marker. attempt=1 is the shell-expanded value
      # the executed job logs on the first successful push, not the unexpanded
      # "$attempt" that appears in the emitted script source.
      expect_log: "cascade-state-write: ok attempt=1"
