name: "Deployable-scoped rollback moves one deployable and leaves the env"
description: |
  Proves a rollback scoped to a single deployable touches only that deployable's
  per-deployable state, leaving the env-level pointer, sibling deployables, and
  env divergence untouched.

  prod runs two deployables (api, web) and is advanced through two published
  versions, so both deployables record commit2 per-deployable state. The rollback
  is dispatched with deployable=api and an explicit target of the first version,
  so preflight resolves api's prior target and only deploy-api re-runs.

  finalize runs deployable-scoped (the generated workflow threads the dispatch
  deployable input through to the CLI), so it re-applies only api's recorded
  per-deployable SHA. It does NOT move env.sha, does NOT mirror onto web, and
  does NOT mark prod diverged. The assertions lock that scope: prod's env-level
  sha stays at commit2, its divergence ref stays cleared, api lands on commit1,
  and web stays on commit2.

  Both deploys are reusable workflows whose inner jobs echo the resolved env/sha
  (no actions/checkout, which act cannot resolve for a reusable callback against
  the per-scenario gitea), so each deploy job runs observably under act. act keys
  them by their inner job ids apideploy / webdeploy; only apideploy runs for a
  scoped dispatch.

config:
  trunk_branch: main
  environments: [dev, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: api
      workflow: .github/workflows/deploy-api.yaml
      triggers: ["**"]
    - name: web
      workflow: .github/workflows/deploy-web.yaml
      triggers: ["**"]

steps:
  - name: "Commit the first version source"
    action: commit
    commit:
      message: "feat: first version"
      files:
        src/app.go: |
          package main
          func main() {}
        # api deploy: unique inner job id apideploy so act keys it distinctly from
        # the web deploy and the build-app job.
        .github/workflows/deploy-api.yaml: |
          name: deploy-api
          on:
            workflow_call:
              inputs:
                environment:
                  required: false
                  type: string
                sha:
                  required: false
                  type: string
          jobs:
            apideploy:
              runs-on: ubuntu-latest
              steps:
                - run: echo "deployed env=${{ inputs.environment }} sha=${{ inputs.sha }}"
        # web deploy: unique inner job id webdeploy.
        .github/workflows/deploy-web.yaml: |
          name: deploy-web
          on:
            workflow_call:
              inputs:
                environment:
                  required: false
                  type: string
                sha:
                  required: false
                  type: string
          jobs:
            webdeploy:
              runs-on: ubuntu-latest
              steps:
                - run: echo "deployed env=${{ inputs.environment }} sha=${{ inputs.sha }}"

  - name: "Orchestrate the first commit into dev"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit1

  - name: "Promote the first version to prod (records per-deployable commit1)"
    action: promote
    promote:
      mode: cascade
      target: prod
    expect:
      state:
        prod:
          sha: commit1
          deploys:
            api:
              sha: commit1
            web:
              sha: commit1

  - name: "Commit a second version source"
    action: commit
    commit:
      message: "feat: second version"
      files:
        src/app.go: |
          package main
          func main() { _ = 2 }

  - name: "Orchestrate the second commit into dev"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit2

  - name: "Promote the second version to prod (advances both deployables)"
    action: promote
    promote:
      mode: cascade
      target: prod
    expect:
      state:
        prod:
          sha: commit2
          deploys:
            api:
              sha: commit2
            web:
              sha: commit2

  # Rollback scoped to the api deployable, targeting the first version. Only
  # deploy-api re-runs. finalize applies api's per-deployable SHA and nothing
  # else: env.sha stays commit2, prod is NOT marked diverged (ref stays cleared),
  # and the web sibling stays on commit2.
  - name: "Rollback only the api deployable to the prior version"
    action: rollback
    rollback:
      environment: prod
      deployable: api
      target: "v0.1.0"
    expect:
      state:
        prod:
          sha: commit2
          cleared: [ref]
          deploys:
            api:
              sha: commit1
            web:
              sha: commit2
      jobs:
        preflight: success
        apideploy: success
        finalize: success
