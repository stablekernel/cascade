name: "Deploy Rollout Strategy Options"
description: |
  A matrix-based deploy that sets the rollout strategy knobs max_parallel and
  fail_fast must render them into the generated promote workflow's deploy job
  strategy block. The matrix path is taken when the deploy declares inputs. The
  fail-fast default is false and no max-parallel line is emitted without a
  rollout, so a deploy that sets fail_fast: true and max_parallel: 2 proves the
  configured values flow through rather than the historical defaults.

  Generation-only. The whole effect of these knobs is the generated strategy
  block, and the runtime behavior they configure (fail-fast cancelling a sibling
  matrix leg, max-parallel throttling) is not observable in act: act does not
  reliably implement matrix fail-fast cancellation, and max-parallel is a timing
  property. The executing proof of a rollout that cancels on failure lives on the
  fleet, not in an e2e grep. This cell is a ceiling, labeled as such, not runtime
  coverage.

config:
  trunk_branch: main
  environments: [dev, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: app
      workflow: deploy.yaml
      triggers: ["src/**"]
      inputs:
        region: us-east-1
      rollout:
        max_parallel: 2
        fail_fast: true

# The deploy callback is staged so it declares the region matrix input the
# generated promote workflow threads through each rollout wave, keeping the
# generated reusable-workflow call valid.
setup_workflows:
  ".github/workflows/deploy.yaml": |
    name: deploy
    on:
      workflow_call:
        inputs:
          environment:
            required: false
            type: string
          sha:
            required: false
            type: string
          region:
            required: false
            type: string
    jobs:
      deploy:
        runs-on: ubuntu-latest
        steps:
          - run: echo "deploy ${{ inputs.region }}"

steps:
  - name: "Seed a minimal source tree; assert the promote strategy block"
    action: commit
    commit:
      message: "seed source"
      files:
        src/main.go: |
          package main

          func main() {}
    expect:
      workflow_files:
        - path: ".github/workflows/promote.yaml"
          contains:
            - "fail-fast: true"
            - "max-parallel: 2"
            # The matrix deploy must thread the per-promotion environment and sha
            # to its callback (the way orchestrate does), or the deploy targets an
            # empty environment while its job name references matrix.environment.
            - "environment: ${{ matrix.environment }}"
            - "sha: ${{ matrix.sha }}"
