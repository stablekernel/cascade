name: "Promote breaking-change gate and release-build dispatch"
description: |
  Verifies at runtime that the multi-environment promote workflow's CLI-driven
  breaking-change gate blocks a breaking promotion into the release stage and
  lets it through once allow_breaking_changes is set (#322).

  Runtime assertion for the gate; generation-only for the release-build dispatch.
  From a published v0.1.0 baseline, a feat! commit is orchestrated to a
  v1.0.0-rc.0 prerelease and cascaded through the prerelease environments (no
  gate). Promoting uat into the release stage without the flag fails at the
  breaking-change gate and leaves both the source state and the published release
  unchanged. The same promote with allow_breaking clears the gate and publishes
  v1.0.0: Publish Release cuts the v1.0.0 tag and reaps the RC, then the run
  stops at the Trigger Release Build step, which shells out to gh to dispatch the
  configured release-build workflow and cannot run under act. The published
  v1.0.0 tag and release are the gate-bypass signal, and they flip against the
  blocked promote purely on the gate. The state leaf does not advance under act
  because Finalize runs after the release-build dispatch; its advance is proven
  on the fleet, where gh is present.

  The release-build dispatch (Trigger Release Build) fires only on a real publish
  against real GitHub, which act cannot exercise, so its emitted shape is
  asserted generation-only and its execution is proven on the fleet.

config:
  trunk_branch: main
  environments: [dev, qa, uat, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: cdk
      workflow: deploy.yaml
      triggers: ["cdk/**"]
  release:
    workflow: .github/workflows/release-build.yaml

# Published v0.1.0 baseline: prerelease envs hold the last RC, release and prod
# hold the published version. The RC tag was reaped at publish time.
setup:
  state:
    dev:
      version: "v0.1.0-rc.0"
    qa:
      version: "v0.1.0-rc.0"
    uat:
      version: "v0.1.0-rc.0"
    release:
      version: "v0.1.0"
    prod:
      version: "v0.1.0"
  tags:
    - "v0.1.0"
  releases:
    - tag: "v0.1.0"
      prerelease: false

steps:
  - name: "Breaking change commit"
    action: commit
    commit:
      message: "feat!: major app refactor"
      files:
        src/app.ts: |
          export function mainV2() {
            console.log("App v1.0.0 - Breaking!");
          }

  - name: "Orchestrate dev; assert the emitted CLI gate and release-build shape"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit1
          version: "v1.0.0-rc.0"
      jobs:
        build-app: success
      releases:
        - tag: "v1.0.0-rc.0"
          prerelease: true
          draft: true
      # Generation-only: these assert the emitted shape of behaviors act cannot
      # execute (the CLI gate wiring and the real-GitHub-only release-build
      # dispatch). The gate's RUNTIME behavior is proven by the blocked/allowed
      # promote pair below; the release-build dispatch's execution is proven on
      # the fleet, since act has no gh to run it.
      workflow_files:
        - path: ".github/workflows/promote.yaml"
          contains:
            - "      allow_breaking_changes:\n"
            - "          cascade promote preflight \\\n"
            - "            --allow-breaking=\"${ALLOW_BREAKING:-false}\" \\\n"
            - "      - name: Trigger Release Build\n"
            - "          gh workflow run release-build.yaml \\\n"
          not_contains:
            # The multi-env promote path uses the CLI gate, not the single-env
            # release workflow's bash "Check Breaking Changes" step.
            - "      - name: Check Breaking Changes\n"

  - name: "Cascade promote dev to qa (prerelease, no gate)"
    action: promote
    promote:
      mode: cascade
      target: qa
    expect:
      state:
        qa:
          sha: commit1
          version: "v1.0.0-rc.0"
        dev:
          unchanged: true

  - name: "Cascade promote qa to uat (prerelease, no gate)"
    action: promote
    promote:
      mode: cascade
      target: uat
    expect:
      state:
        uat:
          sha: commit1
          version: "v1.0.0-rc.0"
        qa:
          unchanged: true

  - name: "Promote uat to release without the flag is blocked at the gate"
    action: promote
    promote:
      mode: default
      expect_failure: true
    expect:
      # The gate blocks before Publish Release, so no v1.0.0 is cut and both the
      # source state and the published release stay put. This is the load-bearing
      # runtime blocked outcome; it flips against the allow_breaking promote below.
      state:
        uat:
          unchanged: true
        release:
          unchanged: true
      releases:
        - tag: "v1.0.0"
          deleted: true

  - name: "Promote uat to release with allow_breaking clears the gate and publishes"
    action: promote
    promote:
      mode: default
      allow_breaking: true
      # The run stops at the act-only gh release-build dispatch, which runs after
      # Publish Release. The gate-bypass proof is the v1.0.0 release Publish
      # Release cut before that step, not the run conclusion.
      expect_failure: true
    expect:
      # allow_breaking clears the gate; Publish Release cuts v1.0.0 and reaps the
      # RC before the run stops at the gh dispatch act cannot run. The published
      # release is the runtime gate-bypass signal and is absent on the blocked
      # promote above. The release state leaf stays put under act because Finalize
      # runs after the dispatch; its advance is proven on the fleet.
      state:
        release:
          unchanged: true
      releases:
        - tag: "v1.0.0"
          prerelease: false
          draft: false
          latest: true
      tags:
        exist: ["v1.0.0"]
        deleted: ["v1.0.0-rc.0"]
