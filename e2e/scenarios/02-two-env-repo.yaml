name: "Two Environment Happy Path"
description: "Repository with dev (prerelease) and prod - full lifecycle through environments"

config:
  trunk_branch: main
  environments: [dev, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: cdk
      workflow: deploy.yaml
      triggers: ["cdk/**"]

steps:
  # Step 1: Push first commit to trunk → creates draft at dev, builds run, deploys run
  - name: "Initial feature commit"
    action: commit
    commit:
      message: "feat: add app feature"
      files:
        src/app.ts: |
          export function main() {
            console.log("App v0.1.0");
          }

  - name: "Orchestrate dev after app feature"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit1
          version: "v0.1.0-rc.0"
      jobs:
        build-app: success
        deploy-cdk: skipped
      releases:
        - tag: "v0.1.0-rc.0"
          prerelease: true
          draft: true
      tags:
        exist: ["v0.1.0-rc.0"]

  # Step 2: Push deploy change to trunk → triggers deploy at dev
  - name: "CDK deployment update"
    action: commit
    commit:
      message: "feat: add CDK stack"
      files:
        cdk/stack.ts: |
          export class AppStack {
            constructor() {
              console.log("Stack v0.1.0");
            }
          }

  - name: "Orchestrate dev after CDK update"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit2
          version: "v0.1.0-rc.1"
          deploys:
            cdk:
              sha: commit2
      jobs:
        build-app: skipped
        deploy-cdk: success
      releases:
        - tag: "v0.1.0-rc.1"
          prerelease: true
          draft: true
      tags:
        exist: ["v0.1.0-rc.0", "v0.1.0-rc.1"]

  # Step 3: Promote dev → creates RC tag (prerelease), state stays at dev
  - name: "Promote dev to release"
    action: promote
    promote:
      mode: default
    expect:
      state:
        release:
          sha: commit2
          version: "v0.1.0"
        dev:
          unchanged: true
      releases:
        - tag: "v0.1.0"
          prerelease: false
          draft: false
          latest: true
      tags:
        exist: ["v0.1.0"]
        deleted: ["v0.1.0-rc.0", "v0.1.0-rc.1"]

  # Step 4: Promote release → publishes final release to prod
  - name: "Promote release to prod"
    action: promote
    promote:
      mode: default
    expect:
      state:
        prod:
          sha: commit2
          version: "v0.1.0"
          deploys:
            cdk:
              sha: commit2
      jobs:
        deploy-cdk: success

  # Step 5: Breaking change commit
  - name: "Breaking change"
    action: commit
    commit:
      message: "feat!: major app refactor"
      files:
        src/app.ts: |
          export function mainV2() {
            console.log("App v2.0.0 - Breaking!");
          }

  - name: "Orchestrate dev after breaking change"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit3
          version: "v1.0.0-rc.0"
      jobs:
        build-app: success
        deploy-cdk: skipped
      releases:
        - tag: "v1.0.0-rc.0"
          prerelease: true
          draft: true
      tags:
        exist: ["v0.1.0", "v1.0.0-rc.0"]

  # Step 6: Attempt promote without breaking flag (should fail at prerelease→release gate)
  - name: "Promote without breaking flag"
    action: promote
    promote:
      mode: default
      expect_failure: true
    expect:
      preflight:
        has_breaking: true
        can_proceed: false
      state:
        dev:
          unchanged: true
        release:
          unchanged: true

  # Step 7: Promote with breaking flag (dev → release)
  - name: "Promote dev to release with breaking flag"
    action: promote
    promote:
      mode: default
      allow_breaking: true
    expect:
      state:
        release:
          sha: commit3
          version: "v1.0.0"
        dev:
          unchanged: true
      releases:
        - tag: "v1.0.0"
          prerelease: false
          draft: false
          latest: true
      tags:
        exist: ["v0.1.0", "v1.0.0"]
        deleted: ["v1.0.0-rc.0"]

  # Step 8: Attempt promote release → prod without breaking flag (should fail at release→prod gate)
  - name: "Promote release to prod without breaking flag"
    action: promote
    promote:
      mode: default
      expect_failure: true
    expect:
      preflight:
        has_breaking: true
        can_proceed: false
      state:
        prod:
          unchanged: true
        release:
          unchanged: true

  # Step 9: Promote release → prod with breaking flag
  - name: "Promote release to prod with breaking flag"
    action: promote
    promote:
      mode: default
      allow_breaking: true
    expect:
      state:
        prod:
          sha: commit3
          version: "v1.0.0"
          deploys:
            cdk:
              sha: commit2
      jobs:
        deploy-cdk: skipped
