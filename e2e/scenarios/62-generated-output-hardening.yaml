name: "Generated output hardening"
description: |
  Verifies three hardening properties of the emitted workflows in one manifest:

  1. if-condition well-formedness: a build-linked deploy with run_policy: force
     contributes no dependency condition and skips setup detection, so its
     condition list is empty. The generator must emit a bare `if: always()`,
     never a dangling `always() &&` with no right operand (GitHub's expression
     parser rejects it, so the whole workflow is unusable). A sibling deploy
     with run_policy: always proves the combined form still chains correctly.

  2. $GITHUB_OUTPUT heredoc integrity: changelog and plan-summary bodies carry
     arbitrary commit-message and manifest-derived text. Every emitted heredoc
     must mint a random delimiter at runtime (dd | base64) so no line of the
     value can close the block early and forge extra step outputs. The fixed
     EOF / CASCADE_EOF delimiters must be gone from orchestrate, promote, and
     the PR-preview summary step.

  3. github-script splice removal: the PR-preview comment step must bind the
     plan body via env: (PLAN_BODY) and read process.env.PLAN_BODY, never
     splice the step output into the script source where a backtick or ${
     in the body would break or extend the script.

  Generator-output verification only.

config:
  trunk_branch: main
  environments: [staging, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: web
      workflow: deploy.yaml
      triggers: ["src/**"]
      depends_on: ["build:app"]
      run_policy: force
    - name: api
      workflow: deploy.yaml
      triggers: ["src/**"]
      depends_on: ["build:app"]
      run_policy: always
  pr_preview:
    enabled: true
    comment: true

steps:
  - name: "Commit triggers generation; assert if-conditions and hardened output plumbing"
    action: commit
    commit:
      message: "feat: add app"
      files:
        src/app.go: |
          package main
          func main() {}
    expect:
      workflow_files:
        - path: ".github/workflows/orchestrate.yaml"
          contains:
            # Force policy with an empty condition list: always() stands alone.
            - "if: always()\n    uses:"
            # Always policy keeps the prefix and chains the dependency condition.
            - "always() &&\n      (needs.build-app.result == 'success' || needs.build-app.result == 'skipped')"
            # Changelog heredoc uses a runtime-random delimiter.
            - "CASCADE_DELIM=\"$(dd if=/dev/urandom bs=15 count=1 status=none | base64)\""
            - "echo \"changelog<<${CASCADE_DELIM}\""
          not_contains:
            # The dangling operator form that GitHub's parser rejects.
            - "always() &&\n    uses:"
            # The forgeable fixed delimiter.
            - "changelog<<EOF"
        - path: ".github/workflows/promote.yaml"
          contains:
            - "CASCADE_DELIM=\"$(dd if=/dev/urandom bs=15 count=1 status=none | base64)\""
            - "echo \"changelog<<${CASCADE_DELIM}\""
          not_contains:
            - "changelog<<EOF"
        - path: ".github/workflows/cascade-pr-preview.yaml"
          contains:
            # Summary body heredoc is randomized like every other heredoc.
            - "echo \"body<<${CASCADE_DELIM}\""
            # Comment step reads the plan body from env, not a script splice.
            - "PLAN_BODY: ${{ steps.summary.outputs.body }}"
            - "process.env.PLAN_BODY"
          not_contains:
            - "CASCADE_EOF"
            - "`${{ steps.summary.outputs.body }}`"
