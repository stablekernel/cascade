name: "Final production release"
description: "Validates promotion to production creates a final published release"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - test
      - uat
      - prod
    builds:
      - name: app
        workflow: ""
        triggers:
          - "src/**"
    deploys:
      - name: services
        workflow: ""
        triggers: []
        depends_on:
          - app

  commits:
    - message: "feat: initial application"
      files:
        src/main.go: |
          package main

          func main() {
              println("Hello World")
          }

  manifest:
    ci:
      state:
        dev:
          sha: "{{HEAD}}"
          version: "0.1.0-rc.0"
          committed_at: "2024-01-01T00:00:00Z"
          committed_by: "system"
        test:
          sha: "{{HEAD}}"
          version: "0.1.0-rc.0"
          committed_at: "2024-01-01T00:00:00Z"
          committed_by: "system"
        uat:
          sha: "{{HEAD}}"
          version: "0.1.0-rc.0"
          committed_at: "2024-01-01T00:00:00Z"
          committed_by: "system"
        prod: {}

  releases:
    - tag: "v0.1.0-rc.0"
      prerelease: true

trigger:
  workflow: promote.yaml
  event: workflow_dispatch
  inputs:
    mode: "uat-to-prod"

expect:
  workflow:
    conclusion: success
  manifest:
    ci:
      state:
        dev:
          sha: "{{HEAD}}"
          version: "0.1.0-rc.0"
        test:
          sha: "{{HEAD}}"
          version: "0.1.0-rc.0"
        uat:
          sha: "{{HEAD}}"
          version: "0.1.0-rc.0"
        prod:
          sha: "{{HEAD}}"
          version: "0.1.0"
  releases:
    - tag: "v0.1.0"
      prerelease: false
