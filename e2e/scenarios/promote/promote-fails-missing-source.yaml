name: "Promote fails on missing source env"
description: |
  Drives a real promote preflight failure under act: a commit lands on trunk
  but is never orchestrated, so dev has no deployment. Promoting dev-to-test
  then fails preflight because the source env is empty. expect_failure on the
  promote step makes that failure the success path, proving the harness
  observes a genuinely failing promote rather than a simulated outcome.

config:
  trunk_branch: main
  environments: [dev, test, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: cdk
      workflow: deploy.yaml
      triggers: ["cdk/**"]

steps:
  - name: "Commit source but never orchestrate, leaving dev empty"
    action: commit
    commit:
      message: "feat: add app source"
      files:
        src/app.go: |
          package main
          func main() {}

  - name: "Promote dev to test fails because dev has no deployment"
    action: promote
    promote:
      mode: cascade
      target: test
      expect_failure: true
