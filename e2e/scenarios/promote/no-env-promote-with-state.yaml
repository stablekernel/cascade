name: "No-environment promotion with existing state"
description: "Validates promotion correctly parses nested prerelease state for no-environment repos"

setup:
  config:
    trunk_branch: main
    environments: []  # No environments - library/CLI project
    builds:
      - name: cli
        triggers:
          - "cmd/**"
          - "internal/**"

  commits:
    - message: "feat: initial CLI implementation"
      files:
        cmd/main.go: |
          package main

          func main() {
              println("Hello from CLI")
          }
        internal/lib/lib.go: |
          package lib

          func Greet() string {
              return "Hello"
          }

  # Pre-existing state in the correct nested structure
  # This tests that promote can parse state.prerelease.sha correctly
  manifest:
    ci:
      state:
        prerelease:
          sha: "{{HEAD}}"
          version: "v1.0.0-rc.0"
          committed_at: "2024-01-01T00:00:00Z"
          committed_by: "system"

  releases:
    - tag: "v1.0.0-rc.0"
      prerelease: true

trigger:
  workflow: promote.yaml
  event: workflow_dispatch
  inputs:
    mode: "default"

expect:
  workflow:
    conclusion: success
  manifest:
    ci:
      state:
        prerelease:
          wiped: true
        release:
          sha: "{{HEAD}}"
          version: "v1.0.0"
  releases:
    - tag: "v1.0.0"
      prerelease: false
