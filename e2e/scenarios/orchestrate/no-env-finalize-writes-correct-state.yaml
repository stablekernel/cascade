name: "No-environment finalize writes correct state structure"
description: "Validates that finalize job writes state under prerelease key (state.prerelease.sha) not root (state.sha)"

setup:
  config:
    trunk_branch: main
    environments: []  # No environments - library/CLI project
    builds:
      - name: cli
        triggers:
          - "cmd/**"

  commits:
    - message: "feat: CLI feature"
      files:
        cmd/main.go: |
          package main

          func main() {
              println("v2 CLI")
          }

  # Start with existing state to ensure finalize preserves structure
  manifest:
    ci:
      state:
        prerelease:
          sha: "0000000000000000000000000000000000000000"
          version: "v0.1.0-rc.0"
          committed_at: "2024-01-01T00:00:00Z"
          committed_by: "system"

  tags:
    - "v0.1.0-rc.0"

trigger:
  workflow: orchestrate.yaml
  event: push

expect:
  workflow:
    conclusion: success
  # Verify state is written under prerelease key, not at root
  manifest:
    ci:
      state:
        prerelease:
          sha: HEAD
          # Version should increment (0.1.0 -> 0.2.0 for feat commit)
