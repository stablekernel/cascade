name: "Multiple builds with dependencies"
description: "Validates that multiple builds trigger correctly based on their source paths"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - prod
    builds:
      - name: frontend
        triggers:
          - "frontend/**"
      - name: backend
        triggers:
          - "backend/**"
      - name: shared
        triggers:
          - "shared/**"

  commits:
    - message: "feat: add frontend application"
      files:
        frontend/index.html: |
          <!DOCTYPE html>
          <html>
            <body>Hello Frontend</body>
          </html>
    - message: "feat: add backend service"
      files:
        backend/server.go: |
          package main

          func main() {
              println("Backend server")
          }
    - message: "feat: add shared library"
      files:
        shared/utils.go: |
          package shared

          func Helper() string {
              return "shared"
          }

trigger:
  workflow: orchestrate.yaml
  event: push

expect:
  workflow:
    conclusion: success
