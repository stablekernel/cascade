name: "Build skipped when no relevant changes"
description: "Validates that pushing non-source changes does not trigger a build"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - prod
    builds:
      - name: app
        triggers:
          - "src/**"

  commits:
    - message: "docs: update README"
      files:
        README.md: |
          # Application

          This is documentation only, should not trigger build.

trigger:
  workflow: orchestrate.yaml
  event: push

expect:
  workflow:
    conclusion: success
