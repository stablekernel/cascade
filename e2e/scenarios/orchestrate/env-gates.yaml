name: "GHA Environment Gates"
description: |
  Verifies that when environment_config.gha_environment is set for an env,
  the generated orchestrate.yaml deploy job carries a job-level environment:
  key pointing at the configured GitHub Environment name (#11).

  The job-level environment: key is only valid on a cascade-owned steps job, so
  the gated deploy here is an inline run: deploy. A reusable-workflow (uses:)
  deploy correctly omits the job-level key, since GitHub Actions forbids it on a
  uses: caller job (#137/#138); the environment name is threaded as a with:
  input instead in that case.

  This is a generator-output verification scenario. The GitHub Environment's
  actual protection rules (required reviewers, wait timers, branch policy,
  scoped secrets) live in the repository's GitHub settings and are not
  exercised here.

config:
  trunk_branch: main
  environments: [dev, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: cdk
      run: |
        echo "deploying cdk"
      shell: bash
      triggers: ["cdk/**"]
  environment_config:
    prod:
      gha_environment: production

steps:
  - name: "Initial commit; assert deploy job carries job-level environment: key"
    action: commit
    commit:
      message: "feat: add app and cdk"
      files:
        src/app.go: |
          package main
          func main() {}
        cdk/stack.go: |
          package cdk
    expect:
      workflow_files:
        - path: ".github/workflows/orchestrate.yaml"
          contains:
            - "deploy-cdk:"
            # Newline-anchored so it matches ONLY the 4-space job-level key and
            # never the 6-space reusable-workflow with: input (which also ends
            # in "environment: ..."). Without the leading \n, "    environment:"
            # is a substring of the 6-space "      environment:" line.
            - "\n    environment: ${{ github.event.inputs.environment || 'dev' }}"
