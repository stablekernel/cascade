name: "Build and deploy both triggered"
description: "Validates that source changes trigger both build and dependent deploy"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - prod
    builds:
      - name: app
        triggers:
          - "src/**"
    deploys:
      - name: deploy-app
        depends_on:
          - app

  commits:
    - message: "feat: add main application"
      files:
        src/main.go: |
          package main

          func main() {
              println("Hello World")
          }

trigger:
  workflow: orchestrate.yaml
  event: push

expect:
  workflow:
    conclusion: success
