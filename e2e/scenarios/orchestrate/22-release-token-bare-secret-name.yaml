name: "Release Token Bare Secret Name Is Wrapped"
description: |
  Reproduces a manifest that sets release_token to a bare secret name (the shape
  that previously broke a multi-env example repo). The Setup CLI step downloads
  the cascade binary from a public release; it must use a resolvable token. When
  the operator writes a bare name like CASCADE_STATE_TOKEN, the generator must
  normalize it to ${{ secrets.CASCADE_STATE_TOKEN }} rather than emit the bare
  identifier, which would reach gh release download as a literal string and fail
  with 401 Bad credentials.

  Generator-output verification scenario; assertion runs on the staged repo after
  StageRepoFromConfig generates workflows but before any orchestrate runs.

config:
  trunk_branch: main
  environments: ["dev", "test", "staging", "prod"]
  release_token: CASCADE_STATE_TOKEN
  builds:
    - name: app
      workflow: build-app.yaml
      triggers: ["src/**"]
  deploys:
    - name: app
      workflow: deploy-app.yaml
      triggers: []

steps:
  - name: "Initial commit; assert the bare release_token is wrapped"
    action: commit
    commit:
      message: "feat: add app build and deploy with a bare release_token"
      files:
        src/main.go: |
          package main
          func main() {}
    expect:
      workflow_files:
        - path: ".github/workflows/orchestrate.yaml"
          contains:
            # Setup CLI token is the wrapped, resolvable secrets expression.
            - "token: ${{ secrets.CASCADE_STATE_TOKEN }}"
          not_contains:
            # The bare secret name must never be emitted as the token value.
            - "token: CASCADE_STATE_TOKEN"
