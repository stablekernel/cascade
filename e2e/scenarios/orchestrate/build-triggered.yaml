name: "Build triggered on source changes"
description: "Validates that pushing changes to src/ triggers a build"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - prod
    builds:
      - name: app
        triggers:
          - "src/**"

  commits:
    - message: "feat: add main application"
      files:
        src/main.go: |
          package main

          func main() {
              println("Hello")
          }

trigger:
  workflow: orchestrate.yaml
  event: push

expect:
  workflow:
    conclusion: success
