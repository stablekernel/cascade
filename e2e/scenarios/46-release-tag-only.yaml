name: "Release own-repo tag-only"
description: |
  Verifies cascade's own-repo release-plumbing generation mode
  (`cascade generate-workflow --own-repo`): the orchestrate finalize step cuts
  the candidate tag only, without pre-creating a draft GitHub release, and cuts
  that tag with the non-triggering GITHUB_TOKEN. This suits a self-publishing
  release workflow (GoReleaser, cascade's own case) that is the sole creator of
  the release object and is reached by the explicit candidate dispatch: it
  prevents both a duplicate release run (the tag push no longer fires alongside
  the dispatch) and an orphaned draft release.

  Own-repo mode is NOT a manifest field. It exists only because cascade itself
  self-publishes through GoReleaser; a downstream repository's manifest has no
  way to reach it, and this scenario's own config block below carries nothing
  own-repo-specific at all. own_repo: true selects the generation mode the same
  way `--own-repo` does on the CLI.

  Covers:
  - `generate-workflow --own-repo` emits tag_only: 'true' on the finalize Manage
    Release step and creates the tag with ${{ secrets.GITHUB_TOKEN }}, not the
    configured release token
  - the explicit candidate dispatch survives and still uses the release token so
    the dispatched run cascades to downstream workflow_run consumers
  - the own-repo composite action exposes the tag_only input
  - plain (non-own-repo) generation is unaffected on both axes: the regression
    step below asserts no tag_only anywhere and the release token retained,
    exactly as every other generator scenario (none of which set own_repo)
    already proves for the rest of the fleet

  Requires release_trigger: dispatch and release_build.workflow (validation enforces
  both, independent of own_repo). Generator-output verification only.

config:
  trunk_branch: main
  release_trigger: dispatch
  release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
  release_build:
    workflow: .github/workflows/release.yaml
  environments: [dev]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys: []

own_repo: true

steps:
  - name: "Initial commit; assert own-repo orchestrate cuts a tag-only rc with GITHUB_TOKEN"
    action: commit
    commit:
      message: "feat: add app"
      files:
        src/app.go: |
          package main
          func main() {}
    expect:
      workflow_files:
        - path: ".github/workflows/orchestrate.yaml"
          contains:
            - "          tag_only: 'true'"
            - "          token: ${{ secrets.GITHUB_TOKEN }}"
            - "      - name: Dispatch Release Candidate Build"
            # Own-repo finalize runs the binary built from the commit under
            # release (from the build-cli callback artifact), not a stale pin,
            # so a new CLI capability (for example --tag-only) is present in the
            # same run that introduces it.
            - "      - name: Download cascade CLI (from source)"
            - "          name: cascade-cli"
        - path: ".github/actions/manage-release/action.yaml"
          contains:
            - "  tag_only:"
            - "--tag-only"
