name: "RC tag created on prerelease"
description: "Validates that an RC (release candidate) tag is created when promoting to a prerelease environment"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - test
      - prod
    builds:
      - name: app
        triggers:
          - "src/**"

  commits:
    - message: "feat: add new feature for release"
      files:
        src/feature.go: |
          package main

          func Feature() string {
              return "new feature"
          }
    - message: "fix: minor bug fix"
      files:
        src/bugfix.go: |
          package main

          func BugFix() bool {
              return true
          }

  manifest:
    ci:
      state:
        dev:
          sha: "{{HEAD}}"
          version: "0.1.0-rc.0"
          committed_at: "2024-01-01T00:00:00Z"
          committed_by: "system"

trigger:
  workflow: promote.yaml
  event: workflow_dispatch
  inputs:
    mode: "dev-to-test"

expect:
  workflow:
    conclusion: success
  tags:
    - pattern: "v0.1.0-rc.0"
