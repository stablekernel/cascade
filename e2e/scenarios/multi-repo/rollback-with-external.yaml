# Scenario: Rollback includes external deploys
#
# This tests that:
# 1. When promotion fails, rollback is triggered
# 2. Rollback includes both local and external deploys
# 3. External deploys receive rollback_sha to revert to

name: rollback-with-external
description: Rollback on failure includes external deploys

repos:
  primary-backend:
    config:
      trunk_branch: master
      environments: [dev, test, prod]
      deploys:
        - name: api
          workflow: .github/workflows/deploy-api.yaml
      external:
        - repo: example/cdk-infra
          ref: main
          deploys:
            - name: cdk
              workflow: example/cdk-infra/.github/workflows/deploy.yaml
    manifest:
      state:
        dev:
          sha: "new-sha"
          version: "v1.1.0-rc.0"
          external:
            cdk:
              sha: "cdk-new"
              version: "v1.1.0-rc.0"
        test:
          sha: "old-sha"
          version: "v1.0.0-rc.0"
          external:
            cdk:
              sha: "cdk-old"
              version: "v1.0.0-rc.0"
    tags:
      - "v1.0.0-rc.0"
      - "v1.1.0-rc.0"

  cdk-infra:
    config:
      trunk_branch: main
      environments: [dev, test, prod]
      deploys:
        - name: cdk
          workflow: .github/workflows/deploy.yaml
      notify:
        repo: example/primary-backend
        workflow: .github/workflows/external-update.yaml
    manifest:
      state:
        dev:
          sha: "cdk-new"
          version: "v1.1.0-rc.0"
        test:
          sha: "cdk-old"
          version: "v1.0.0-rc.0"

primary: primary-backend

steps:
  # This scenario demonstrates the state setup for rollback testing
  # Actual rollback would be triggered by promote workflow failure
  # Here we verify the rollback SHA is correctly identified

  # Step 1: Verify initial test state (rollback target)
  - name: verify-test-state
    repo: primary-backend
    action: assert
    expect:
      tags:
        - "v1.0.0-rc.0"

  # Step 2: Verify dev state (source for promotion)
  - name: verify-dev-state
    repo: primary-backend
    action: assert
    expect:
      tags:
        - "v1.1.0-rc.0"

expect:
  repos:
    primary-backend:
      tags:
        - pattern: "v1.0.0-rc.0"
        - pattern: "v1.1.0-rc.0"
      state:
        test:
          sha: "old-sha"
          external:
            cdk:
              sha: "cdk-old"
