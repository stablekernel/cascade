name: "Hotfix branch created"
description: "Validates hotfix branch is created from production tag"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - test
      - prod
    builds:
      - name: app
        workflow: build-app.yaml
        triggers:
          - "src/**"
    deploys:
      - name: app
        workflow: deploy-app.yaml
        triggers:
          - "src/**"

  commits:
    - message: "feat: initial release"
      files:
        src/main.go: |
          package main

          func main() {
              println("Hello v1.0.0")
          }

  tags:
    - "v1.0.0"

  manifest:
    environments:
      prod:
        sha: "{{HEAD}}"
        version: "1.0.0"
        image_tag: "abc1234-1234567890"

trigger:
  workflow: hotfix.yaml
  event: workflow_call
  inputs:
    config_path: ".github/cicd-config.yaml"
    manifest_path: ".github/manifest.yaml"
    hotfix_branch: "hotfix/critical-fix"

expect:
  workflow:
    conclusion: success
    jobs:
      validate:
        conclusion: success
      build:
        conclusion: success
      deploy:
        conclusion: success
      finalize:
        conclusion: success
