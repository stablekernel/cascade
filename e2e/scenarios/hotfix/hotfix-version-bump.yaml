name: "Hotfix version bump"
description: "Validates hotfix increments patch version correctly"

setup:
  config:
    trunk_branch: main
    environments:
      - dev
      - test
      - prod
    builds:
      - name: app
        workflow: build-app.yaml
        triggers:
          - "src/**"
      - name: worker
        workflow: build-worker.yaml
        triggers:
          - "worker/**"
    deploys:
      - name: app
        workflow: deploy-app.yaml
        triggers:
          - "src/**"
      - name: worker
        workflow: deploy-worker.yaml
        triggers:
          - "worker/**"

  commits:
    - message: "feat: initial release"
      files:
        src/main.go: |
          package main

          func main() {
              println("Hello v2.5.3")
          }
        worker/main.go: |
          package main

          func main() {
              println("Worker v2.5.3")
          }

  tags:
    - "v2.5.3"

  manifest:
    environments:
      dev:
        sha: "{{HEAD}}"
        version: "2.6.0-dev"
        image_tag: "dev1234-1234567890"
      test:
        sha: "{{HEAD}}"
        version: "2.6.0-rc.1"
        image_tag: "test5678-1234567890"
      prod:
        sha: "{{HEAD}}"
        version: "2.5.3"
        image_tag: "prod9012-1234567890"

trigger:
  workflow: hotfix.yaml
  event: workflow_call
  inputs:
    config_path: ".github/cicd-config.yaml"
    manifest_path: ".github/manifest.yaml"
    hotfix_branch: "hotfix/bug-fix"
    version_override: "2.5.4"

expect:
  workflow:
    conclusion: success
    jobs:
      validate:
        conclusion: success
      build:
        conclusion: success
      deploy:
        conclusion: success
      finalize:
        conclusion: success

  manifest:
    environments:
      prod:
        version: "2.5.4"
      dev:
        version: "2.6.0-dev"
      test:
        version: "2.6.0-rc.1"

  tags:
    - pattern: "v2.5.4"
      on_sha: "{{HEAD}}"

  releases:
    - tag: "v2.5.4"
      prerelease: false
