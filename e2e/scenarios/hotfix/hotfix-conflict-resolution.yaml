name: "Hotfix Conflict Resolution"
description: |
  Verifies the hotfix conflict path: a cherry-pick onto env/test produces
  merge conflicts, resolve_conflict supplies clean content, the PR is merged,
  and hotfix_merged records the finalized state.

  The conflict is engineered by:
  - commit1: src/shared.go with Version = "1"
  - promote to test/prod (both anchored at commit1)
  - commit2: src/shared.go Version = "2" (trunk advances, dev re-orchestrated)
  - commit3: src/shared.go Version = "2-patched" (fix on top of commit2)
  - hotfix_apply commit3 onto env/test (which has "1") triggers conflict
    because the cherry-pick context expects "2" but finds "1"

config:
  trunk_branch: main
  environments: [dev, test, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: deploy-dev
      workflow: deploy.yaml
      triggers: ["src/**"]
    - name: deploy-test
      workflow: deploy.yaml
      triggers: ["src/**"]
    - name: deploy-prod
      workflow: deploy.yaml
      triggers: ["src/**"]

steps:
  - name: "Initial shared file with Version 1"
    action: commit
    commit:
      message: "feat: add shared version"
      files:
        src/shared.go: |
          package main
          const Version = "1"

  - name: "Orchestrate dev at commit1"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit1
          version: "v0.1.0-rc.0"

  - name: "Promote dev to test"
    action: promote
    promote:
      mode: default
    expect:
      state:
        test:
          sha: commit1
        dev:
          sha: commit1

  - name: "Promote test to prod"
    action: promote
    promote:
      mode: default
    expect:
      state:
        prod:
          sha: commit1
        test:
          sha: commit1

  - name: "Trunk advances: Version 2"
    action: commit
    commit:
      message: "feat: bump version to 2"
      files:
        src/shared.go: |
          package main
          const Version = "2"

  - name: "Orchestrate dev at commit2 (test/prod stay at commit1)"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit2

  - name: "Fix commit: Version 2-patched (cherry-pick context is '2')"
    action: commit
    commit:
      message: "fix: patch version string"
      files:
        src/shared.go: |
          package main
          const Version = "2-patched"

  - name: "Plan hotfix for test at commit3"
    action: hotfix_plan
    hotfix_plan:
      commit_ref: commit3
      target_env: test

  - name: "Apply hotfix to test (triggers conflict)"
    action: hotfix_apply
    hotfix_apply:
      target_env: test
      commit_ref: commit3
    expect:
      branches:
        exist: ["env/test"]
      prs:
        open_with_label: "cascade-hotfix-conflict"

  - name: "Resolve conflict with patched content for Version 1 base"
    action: resolve_conflict
    resolve_conflict:
      files:
        src/shared.go: |
          package main
          const Version = "1-patched"

  - name: "Merge hotfix conflict PR"
    action: merge_pr
    merge_pr:
      label: "cascade-hotfix-conflict"

  - name: "Finalize hotfix for test"
    action: hotfix_merged
    hotfix_merged:
      target_env: test
    expect:
      state:
        test:
          ref: "env/test"
          base_sha: commit1
          patches: [commit3]
        dev:
          sha: commit2
        prod:
          sha: commit1
