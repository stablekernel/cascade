name: "Hotfix Conflict Resolution"
description: |
  Verifies the hotfix conflict path: a cherry-pick onto env/test produces
  merge conflicts, resolve_conflict supplies clean content, the PR is merged,
  and hotfix_merged records the finalized state.

  The conflict is engineered by:
  - commit1: src/shared.go with Version = "1"
  - promote to test/prod (both anchored at commit1)
  - commit2: src/shared.go Version = "2" (trunk advances, dev re-orchestrated)
  - commit3: src/shared.go Version = "2-patched" (fix on top of commit2)
  - hotfix_apply commit3 onto env/test (which has "1") triggers conflict
    because the cherry-pick context expects "2" but finds "1"

config:
  trunk_branch: main
  environments: [dev, test, prod]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: deploy-dev
      workflow: deploy.yaml
      triggers: ["src/**"]
    - name: deploy-test
      workflow: deploy.yaml
      triggers: ["src/**"]
    - name: deploy-prod
      workflow: deploy.yaml
      triggers: ["src/**"]

steps:
  - name: "Initial shared file with Version 1"
    action: commit
    commit:
      message: "feat: add shared version"
      files:
        src/shared.go: |
          package main
          const Version = "1"

  - name: "Orchestrate dev at commit1"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit1
          version: "v0.1.0-rc.0"

  - name: "Promote dev to test"
    action: promote
    promote:
      mode: default
    expect:
      state:
        test:
          sha: commit1
        dev:
          sha: commit1

  - name: "Promote test to release"
    action: promote
    promote:
      mode: default
    expect:
      state:
        test:
          sha: commit1
        dev:
          sha: commit1

  - name: "Promote release to prod"
    action: promote
    promote:
      mode: default
    expect:
      state:
        prod:
          sha: commit1
        test:
          sha: commit1

  - name: "Trunk advances: Version 2"
    action: commit
    commit:
      message: "feat: bump version to 2"
      files:
        src/shared.go: |
          package main
          const Version = "2"

  - name: "Orchestrate dev at commit2 (test/prod stay at commit1)"
    action: orchestrate
    expect:
      state:
        dev:
          sha: commit2

  - name: "Fix commit: Version 2-patched (cherry-pick context is '2')"
    action: commit
    commit:
      message: "fix: patch version string"
      files:
        src/shared.go: |
          package main
          const Version = "2-patched"

  - name: "Plan hotfix for test at commit3"
    action: hotfix_plan
    hotfix_plan:
      commit_ref: commit3
      target_env: test
      dry_run: true

  - name: "Apply hotfix to test"
    action: hotfix_apply
    hotfix_apply:
      target_env: test
      commit_ref: commit3
      # Pin the env/test anchor to commit1 (Version "1"). The cherry-pick outcome
      # is fully determined by the anchor content: commit3's diff rewrites the
      # Version line from "2" to "2-patched", so applying it onto a tree where
      # that line reads "1" produces a textual conflict every run. Without this
      # pin the harness anchored on the recorded test SHA, which a gitea state
      # sync race could momentarily report empty and silently flip the anchor to
      # the just-patched trunk tip, turning the conflict into an empty (clean)
      # cherry-pick and the PR label from -conflict to plain cascade-hotfix.
      base_ref: commit1
    expect:
      branches:
        exist: ["env/test"]
      # The cherry-pick conflicts deterministically here (see base_ref above):
      # commit3's Version edit overlaps the "1" still on env/test, so the apply
      # job opens the conflict-resolution PR labeled cascade-hotfix-conflict.
      # The resolve step below pushes resolved content onto the PR head and
      # replays the check, exercising the full conflict-resolution path the
      # scenario name promises.
      prs:
        open_with_label: "cascade-hotfix-conflict"
      # The gitea harness creates PR labels on demand, so it cannot reproduce the
      # real-GitHub behavior where "gh pr create --label X" fails hard when X does
      # not yet exist. That gap let a missing label seed ship undetected: the
      # generated apply job opened the conflict PR with --label
      # cascade-hotfix-conflict but never created that label. Assert against the
      # materialized workflow that real GitHub runs verbatim: the apply job must
      # seed both labels before any PR is opened, and the workflow must request
      # issues:write so "gh label create" is authorized.
      workflow_files:
        - path: ".github/workflows/cascade-hotfix.yaml"
          contains:
            - "gh label create cascade-hotfix "
            - "gh label create cascade-hotfix-conflict "
            - "issues: write"

  - name: "Resolve conflict with patched content for Version 1 base"
    action: resolve_conflict
    resolve_conflict:
      files:
        src/shared.go: |
          package main
          const Version = "1-patched"

  - name: "Merge hotfix PR"
    action: merge_pr
    merge_pr:
      # Matches the label the apply step recorded: the cherry-pick conflicts here
      # (see the base_ref note on the apply step), so the resolution PR carries
      # cascade-hotfix-conflict.
      label: "cascade-hotfix-conflict"

  - name: "Finalize hotfix for test"
    action: hotfix_merged
    hotfix_merged:
      target_env: test
    expect:
      # The e2e backend is gitea, so this step asserts only the gitea-observable
      # boundary: the merged commit on env/test, the finalize job's success
      # conclusion, and the finalized hotfix state (written via the gitea
      # contents/git push path). The release-object lifecycle and the hotfix tag
      # materialization are GitHub-only behaviors (the tag is never cut and the
      # release object is never created against a non-GitHub host), so they are
      # exercised by the real-GitHub validation fleet rather than asserted here.
      state:
        test:
          ref: "env/test"
          base_sha: commit1
          patches: [commit3]
        dev:
          sha: commit2
        prod:
          sha: commit1
