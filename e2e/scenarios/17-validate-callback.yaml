name: "Validate Callback Gate"
description: |
  Verifies that a top-level validate callback adds a validate job to the
  generated orchestrate.yaml and gates the build jobs on its success via a
  needs.validate.result == 'success' condition (#94).

  Generator-output verification only.

config:
  trunk_branch: main
  environments: [dev]
  builds:
    - name: app
      workflow: build.yaml
      triggers: ["src/**"]
  deploys:
    - name: deploy-dev
      workflow: deploy.yaml
      triggers: ["src/**"]
  validate:
    workflow: validate.yaml

steps:
  - name: "Initial commit; assert validate gate in orchestrate.yaml"
    action: commit
    commit:
      message: "feat: add app"
      files:
        src/app.go: |
          package main
          func main() {}
        # Reusable validate callback the generated orchestrate.yaml invokes as a
        # uses: job. Its inner job echoes "validate" so the gate has a real job to
        # wait on; the orchestrate build jobs gate on needs.validate.result.
        .github/workflows/validate.yaml: |
          name: validate
          on:
            workflow_call:
              inputs:
                environment:
                  required: false
                  type: string
                sha:
                  required: false
                  type: string
          jobs:
            runvalidate:
              runs-on: ubuntu-latest
              steps:
                - run: echo "validate"
    expect:
      workflow_files:
        - path: ".github/workflows/orchestrate.yaml"
          contains:
            - "validate:"
            - "needs.validate.result == 'success'"
