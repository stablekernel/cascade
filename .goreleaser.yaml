# GoReleaser configuration for cascade
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cascade
    main: ./cmd/cascade
    binary: cascade
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: archives
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.spdx.json"

signs:
  # cosign keyless signing (OIDC + sigstore)
  - id: cosign
    cmd: cosign
    args:
      - sign-blob
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    output: true

  # GPG signing. The release key has no passphrase (it lives only as a repo
  # secret, the same trust boundary a passphrase would), so no passphrase
  # handling is needed.
  - id: gpg
    cmd: gpg
    args:
      - --batch
      - --no-tty
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --armor
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.asc"
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: stablekernel
    name: cascade
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
