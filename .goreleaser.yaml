# GoReleaser configuration for cascade
# https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cascade
    main: ./cmd/cascade
    binary: cascade
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: archives
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: stablekernel
    name: cascade
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
