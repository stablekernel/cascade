site_name: Cascade
site_description: >-
  Manifest-driven release orchestration for GitHub Actions — coordinate
  builds, promotions, and releases across any environment topology.
site_url: https://stablekernel.github.io/cascade/
repo_url: https://github.com/stablekernel/cascade
repo_name: stablekernel/cascade
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Getting Started: getting-started.md
  - Manifest Reference: configuration.md
  - Callback Contract: callback-contract.md
  - Workflows:
      - Overview: workflows.md
  - CLI Reference: cli-reference.md
  - Architecture: architecture.md
  - Versioning & Schema: versioning.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stablekernel/cascade
