ci:
  config:
    trunk_branch: main
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.1.0
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    changelog:
      contributors: true
  state:
    prerelease:
      sha: df50416540667ebd8dea4579281c8de4444b3fed
      version: v0.2.0-rc.52
      committed_at: "2026-06-14T11:15:08Z"
      committed_by: joshua-temple
