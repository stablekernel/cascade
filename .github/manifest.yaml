ci:
  config:
    trunk_branch: main
    release_trigger: dispatch
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.8.0
    cli_version_sha: 58c3d309faaf5028aa03900aded8424e738afb81
    pin_mode: sha
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    release:
      workflow: .github/workflows/release.yaml
    changelog:
      contributors: true
  state:
    prerelease:
      sha: ba33a64b96ce6155673e7e73d61e097683a4086c
      version: v0.9.3-rc.0
      committed_at: "2026-07-06T23:51:42Z"
      committed_by: joshua-temple
