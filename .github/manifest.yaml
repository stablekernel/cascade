ci:
  config:
    trunk_branch: main
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.1.0
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    changelog:
      contributors: true
  state:
    prerelease:
      sha: c79563d49a7dc08f58af266bf83a677b9d42cb80
      version: v0.3.0-rc.15
      committed_at: "2026-06-21T20:19:49Z"
      committed_by: joshua-temple
