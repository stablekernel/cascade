ci:
  config:
    trunk_branch: main
    release_trigger: dispatch
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.1.0
    cli_version_sha: 9dc69a1f66753a3865c38c34eca5a931f677c803
    pin_mode: sha
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    changelog:
      contributors: true
  state:
    prerelease:
      sha: 308fd8ae1beaf5bdfca0820d78028bb38589b9e4
      version: v0.8.0-rc.5
      committed_at: "2026-07-05T04:50:29Z"
      committed_by: joshua-temple
