ci:
  config:
    trunk_branch: main
    release_trigger: dispatch
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.8.0
    cli_version_sha: 58c3d309faaf5028aa03900aded8424e738afb81
    pin_mode: sha
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    release_build:
      workflow: .github/workflows/release.yaml
    changelog:
      contributors: true
  state:
    prerelease:
      sha: 5f7f4f6af35e0bfb2e3dc78e281c8a091e4f021d
      version: v1.1.3-rc.3
      committed_at: "2026-11-23T07:04:21Z"
      committed_by: joshua-temple
