ci:
  config:
    trunk_branch: main
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.1.0
    pin_mode: sha
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    changelog:
      contributors: true
  state:
    prerelease:
      sha: 379b0324476a849cafb4bff527e965fc85d4dca0
      version: v0.3.0-rc.22
      committed_at: "2026-06-23T06:41:48Z"
      committed_by: joshua-temple
