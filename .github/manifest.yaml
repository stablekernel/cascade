ci:
  config:
    trunk_branch: main
    release_trigger: dispatch
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.8.0
    cli_version_sha: 58c3d309faaf5028aa03900aded8424e738afb81
    pin_mode: sha
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    release:
      workflow: .github/workflows/release.yaml
    changelog:
      contributors: true
  state:
    prerelease:
      sha: 0b23d064f7715f186d1b48ebd6bb04d6f4a88666
      version: v0.12.0-rc.1
      committed_at: "2026-07-08T17:34:41Z"
      committed_by: joshua-temple
