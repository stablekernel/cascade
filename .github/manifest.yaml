ci:
  config:
    trunk_branch: main
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.1.0
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    changelog:
      contributors: true
  state:
    prerelease:
      sha: 7a74fc6bb74735e2e7e10563f93739f0bd6e4344
      version: v0.2.0-rc.20
      committed_at: "2026-06-11T02:37:42Z"
      committed_by: joshua-temple
