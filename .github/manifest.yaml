ci:
  config:
    trunk_branch: main
    release_trigger: dispatch
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.8.0
    cli_version_sha: 58c3d309faaf5028aa03900aded8424e738afb81
    pin_mode: sha
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    release:
      workflow: .github/workflows/release.yaml
    changelog:
      contributors: true
  state:
    prerelease:
      sha: 630e9396f0bd0e0105e5d26b3fca24cd916aba27
      version: v0.14.1-rc.0
      committed_at: "2026-07-11T07:33:32Z"
      committed_by: joshua-temple
