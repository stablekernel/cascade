ci:
  config:
    trunk_branch: main
    release_trigger: dispatch
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    release_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    triggers:
      - cmd/**
      - internal/**
      - e2e/**
      - go.mod
      - go.sum
    cli_version: v0.1.0
    pin_mode: sha
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    validate:
      workflow: .github/workflows/validate.yaml
    builds:
      - name: cli
        workflow: .github/workflows/build-cli.yaml
        triggers: []
    changelog:
      contributors: true
  state:
    prerelease:
      sha: 3722c8ea2693b00fd2202ca56201c8c22f81d950
      version: v0.5.1-rc.0
      committed_at: "2026-06-26T17:46:26Z"
      committed_by: joshua-temple
