name: 'Setup cascade CLI'
description: 'Install the cascade CLI tool from pre-built release binaries'

inputs:
  version:
    description: 'CLI version tag (e.g., latest, v1.0.0)'
    required: false
    default: 'latest'
  token:
    description: 'GitHub token for private repo access'
    required: true

outputs:
  version:
    description: 'Installed CLI version'
    value: ${{ steps.version.outputs.version }}
  cache-hit:
    description: 'Whether CLI was restored from cache'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Check if CLI already installed
      id: check
      shell: bash
      run: |
        if command -v cascade &> /dev/null; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve version tag
      if: steps.check.outputs.installed != 'true'
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        # Resolve "latest" to the concrete release tag so the cache key is
        # stable across version bumps and never aliases multiple releases.
        if [[ "$VERSION" == "latest" ]]; then
          TAG=$(gh release list -R stablekernel/cascade -L 1 --json tagName -q '.[0].tagName')
        else
          TAG="$VERSION"
        fi
        printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

    - name: Determine archive name
      if: steps.check.outputs.installed != 'true'
      id: binary
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        echo "name=cascade_${OS}_${ARCH}" >> "$GITHUB_OUTPUT"
        echo "pattern=cascade_*_${OS}_${ARCH}.tar.gz" >> "$GITHUB_OUTPUT"

    - name: Restore CLI from cache
      if: steps.check.outputs.installed != 'true'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/cascade
        key: cascade-${{ steps.binary.outputs.name }}-${{ steps.resolve.outputs.tag }}

    - name: Download, verify, and install CLI
      if: steps.check.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ARCHIVE_PATTERN: ${{ steps.binary.outputs.pattern }}
      run: |
        echo "Downloading archive matching $ARCHIVE_PATTERN from release $TAG..."
        TMPDIR=$(mktemp -d)
        gh release download "$TAG" \
          -R stablekernel/cascade \
          -p "$ARCHIVE_PATTERN" \
          -D "$TMPDIR"

        # Integrity gate: every release publishes checksums.txt, and nothing
        # is installed until the downloaded archive's sha256 matches it. A
        # release without checksums.txt, an archive with no checksum entry,
        # or a hash mismatch all abort the install.
        gh release download "$TAG" \
          -R stablekernel/cascade \
          -p "checksums.txt" \
          -D "$TMPDIR"

        cd "$TMPDIR"
        shopt -s nullglob
        archives=(cascade_*.tar.gz)
        if [ "${#archives[@]}" -ne 1 ]; then
          echo "::error::Expected exactly one downloaded archive for $ARCHIVE_PATTERN, found ${#archives[@]}; refusing to install."
          exit 1
        fi
        ARCHIVE="${archives[0]}"
        if ! awk -v f="$ARCHIVE" '$2 == f { print; ok = 1 } END { exit ok ? 0 : 1 }' checksums.txt > archive.sha256; then
          echo "::error::No checksum entry for $ARCHIVE in checksums.txt of release $TAG; refusing to install."
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c archive.sha256
        else
          shasum -a 256 -c archive.sha256
        fi

        # Authenticity gate: the release pipeline cosign-signs checksums.txt
        # keylessly (Sigstore bundle format, cosign v3). Verify the signature
        # whenever the bundle and a cosign binary are available; a failed
        # verification always aborts. If either is unavailable (an old
        # release without a bundle, or a runner without cosign), fall back to
        # the checksum gate above with a loud warning, never silently.
        # Manual equivalent: docs/release-verification.md.
        if gh release download "$TAG" -R stablekernel/cascade -p "checksums.txt.bundle" -D .; then
          if command -v cosign >/dev/null 2>&1; then
            # cosign v2 needs --new-bundle-format to read the Sigstore
            # bundle format that the release pipeline (cosign v3) emits;
            # probe the flag so both major versions verify correctly.
            NEW_BUNDLE_FLAG=""
            COSIGN_HELP="$(cosign verify-blob --help 2>&1 || true)"
            case "$COSIGN_HELP" in
              *--new-bundle-format*) NEW_BUNDLE_FLAG="--new-bundle-format=true" ;;
            esac
            cosign verify-blob \
              --bundle=checksums.txt.bundle \
              --certificate-identity-regexp='^https://github.com/stablekernel/cascade/' \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              ${NEW_BUNDLE_FLAG:+"$NEW_BUNDLE_FLAG"} \
              checksums.txt
            echo "cosign signature on checksums.txt verified."
          else
            echo "::warning::cosign not found on this runner; proceeding on sha256 verification only (checksums.txt signature not verified)."
          fi
        else
          echo "::warning::Could not download checksums.txt.bundle for release $TAG; proceeding on sha256 verification only (checksums.txt signature not verified)."
        fi

        tar -xzf "$ARCHIVE"
        install -m 0755 cascade /usr/local/bin/cascade
        cd /
        rm -rf "$TMPDIR"

    - name: Get CLI version
      id: version
      shell: bash
      run: |
        # Robustly capture a single-line version, sanitized for GHA's output
        # file format. Older form `echo "version=$RAW" >> $GITHUB_OUTPUT`
        # produced `##[error]Invalid format 'unknown'` against the v1.1.0
        # binary (likely a GHA file-command parser quirk where certain
        # values get mis-interpreted as a format directive). Strip CR/newlines
        # and non-printable characters, fall back to "unknown" on empty/error,
        # cap length, and use printf instead of echo to avoid backslash
        # interpretation surprises.
        RAW=$(cascade version 2>/dev/null || true)
        INSTALLED_VERSION=$(printf '%s' "$RAW" | head -n 1 | tr -d '\r\n' | tr -dc '[:print:]' | head -c 200)
        if [ -z "$INSTALLED_VERSION" ]; then
          INSTALLED_VERSION="unknown"
        fi
        printf 'version=%s\n' "$INSTALLED_VERSION" >> "$GITHUB_OUTPUT"
