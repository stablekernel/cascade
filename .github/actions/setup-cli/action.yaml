name: 'Setup cascade CLI'
description: 'Install the cascade CLI tool from pre-built release binaries'

inputs:
  version:
    description: 'CLI version tag (e.g., latest, v1.0.0)'
    required: false
    default: 'latest'
  token:
    description: 'GitHub token for private repo access'
    required: true

outputs:
  version:
    description: 'Installed CLI version'
    value: ${{ steps.version.outputs.version }}
  cache-hit:
    description: 'Whether CLI was restored from cache'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Check if CLI already installed
      id: check
      shell: bash
      run: |
        if command -v cascade &> /dev/null; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve version tag
      if: steps.check.outputs.installed != 'true'
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        # Resolve "latest" to the concrete release tag so the cache key is
        # stable across version bumps and never aliases multiple releases.
        # Pre-releases and drafts are excluded to match GitHub's own "latest"
        # semantics (and the pin-reconcile resolvers): a default caller must
        # never install an rc or dryrun build.
        if [[ "$VERSION" == "latest" ]]; then
          TAG=$(gh release list -R stablekernel/cascade -L 1 --exclude-pre-releases --exclude-drafts --json tagName -q '.[0].tagName')
        else
          TAG="$VERSION"
        fi
        printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

    - name: Determine archive name
      if: steps.check.outputs.installed != 'true'
      id: binary
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        echo "name=cascade_${OS}_${ARCH}" >> "$GITHUB_OUTPUT"
        echo "pattern=cascade_*_${OS}_${ARCH}.tar.gz" >> "$GITHUB_OUTPUT"

    - name: Restore CLI from cache
      if: steps.check.outputs.installed != 'true'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/cascade
        key: cascade-${{ steps.binary.outputs.name }}-${{ steps.resolve.outputs.tag }}

    - name: Install cosign for release signature verification
      # install.sh verifies the cosign-signed checksums.txt bundle when a cosign
      # binary is on PATH, and only falls back to the sha256 gate (with a loud
      # warning) when it is absent. Stock runners do not ship cosign, so install
      # it here to keep the authenticity gate active. cosign-installer no-ops if
      # cosign is already present, and this only runs when a download is due.
      if: steps.check.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download, verify, and install CLI
      if: steps.check.outputs.installed != 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ARCHIVE_PATTERN: ${{ steps.binary.outputs.pattern }}
      run: |
        # The download/verify/install logic lives in install.sh so shellcheck
        # lints it and internal/setupcli exercises it hermetically (good
        # checksum, tampered checksum, missing entry, rejected signature).
        bash "$GITHUB_ACTION_PATH/install.sh"

    - name: Get CLI version
      id: version
      shell: bash
      run: |
        # Robustly capture a single-line version, sanitized for GHA's output
        # file format. Older form `echo "version=$RAW" >> $GITHUB_OUTPUT`
        # produced `##[error]Invalid format 'unknown'` against the v1.1.0
        # binary (likely a GHA file-command parser quirk where certain
        # values get mis-interpreted as a format directive). Strip CR/newlines
        # and non-printable characters, fall back to "unknown" on empty/error,
        # cap length, and use printf instead of echo to avoid backslash
        # interpretation surprises.
        RAW=$(cascade version 2>/dev/null || true)
        INSTALLED_VERSION=$(printf '%s' "$RAW" | head -n 1 | tr -d '\r\n' | tr -dc '[:print:]' | head -c 200)
        if [ -z "$INSTALLED_VERSION" ]; then
          INSTALLED_VERSION="unknown"
        fi
        printf 'version=%s\n' "$INSTALLED_VERSION" >> "$GITHUB_OUTPUT"
