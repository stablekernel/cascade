# Build cascade CLI
# Called by orchestrate workflow - no direct triggers
# Distribution: Use `go install github.com/stablekernel/cascade/cmd/cascade@latest`
# End-to-end coverage is the required PR gate (e2e.yaml); it does not run here.
name: Build CLI

on:
  workflow_call:
    inputs:
      sha:
        description: 'SHA to build'
        type: string
        required: false
    outputs:
      result:
        description: 'Build result (success/failure)'
        # Must reference a real job output: in a workflow_call output the jobs
        # context exposes only outputs, so jobs.build.result resolves empty and
        # the caller's cli_result guard never sees a value.
        value: ${{ jobs.build.outputs.result }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o cascade ./cmd/cascade

      - name: Verify CLI works
        run: |
          ./cascade version
          ./cascade --help
          ./cascade lint --help
          ./cascade detect-changes --help
          ./cascade generate-changelog --help
          ./cascade generate-workflow --help

      # Publish the from-source binary so cascade's own-repo finalize job runs the
      # exact commit under release (new CLI capabilities are available in the same
      # run that introduces them) instead of a stale pinned release.
      - name: Upload CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-cli
          path: cascade
          if-no-files-found: error
          retention-days: 1

      # Runs even when a prior step failed so the job output carries the real
      # success/failure signal; job.status here reflects the steps above.
      - name: Record result
        id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "result=$JOB_STATUS" >> "$GITHUB_OUTPUT"
