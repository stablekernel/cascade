# AUTO-GENERATED by cascade - DO NOT EDIT MANUALLY
# Regenerate with: cascade generate-workflow --config .github/manifest.yaml

name: Orchestrate CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'e2e/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        type: boolean
        default: false

concurrency:
  group: orchestrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      run_build_cli: ${{ steps.setup.outputs.run_build_cli }}
      head_sha: ${{ steps.setup.outputs.head_sha }}
      version: ${{ steps.setup.outputs.version }}
      previous_tag: ${{ steps.setup.outputs.previous_tag }}
      changelog_base_sha: ${{ steps.setup.outputs.changelog_base_sha }}
      base_build_cli: ${{ steps.setup.outputs.base_build_cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v0.1.0
      - name: Run Setup
        id: setup
        run: |
          cascade orchestrate setup \
            --config .github/manifest.yaml \
            --gha-output

  validate:
    name: Validate (validate)
    needs: [setup]
    uses: ./.github/workflows/validate.yaml
    secrets: inherit

  build-cli:
    name: Build (cli)
    needs: [setup, validate]
    if: |
      needs.setup.outputs.run_build_cli == 'true' &&
      needs.validate.result == 'success'
    uses: ./.github/workflows/build-cli.yaml
    with:
      sha: ${{ needs.setup.outputs.head_sha }}
    secrets: inherit

  finalize:
    name: Finalize
    needs: [setup, validate, build-cli]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      cli_result: ${{ needs.build-cli.outputs.result }}
      validate_result: ${{ needs.validate.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Summary
        run: |
          echo "## Orchestration Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Callback Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Callback | Result | On Failure |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validate (validate) | ${{ needs.validate.result }} | abort |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build (cli) | ${{ needs.build-cli.result }} | abort |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Outputs" >> "$GITHUB_STEP_SUMMARY"
          HAS_OUTPUTS=false
          if [[ -n "${{ needs.build-cli.outputs.result }}" ]]; then
            if [[ "$HAS_OUTPUTS" == "false" ]]; then
              echo "| Output | Value |" >> "$GITHUB_STEP_SUMMARY"
              echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
              HAS_OUTPUTS=true
            fi
            echo "| cli_result | ${{ needs.build-cli.outputs.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "${{ needs.validate.outputs.result }}" ]]; then
            if [[ "$HAS_OUTPUTS" == "false" ]]; then
              echo "| Output | Value |" >> "$GITHUB_STEP_SUMMARY"
              echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
              HAS_OUTPUTS=true
            fi
            echo "| validate_result | ${{ needs.validate.outputs.result }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$HAS_OUTPUTS" == "false" ]]; then
            echo "_No outputs produced_" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v0.1.0
      - name: Generate Changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use changelog_base_sha which compares this env to next env
          # This shows commits in this env NOT yet promoted to next env
          RESULT=$(cascade generate-changelog \
            --base-sha "${{ needs.setup.outputs.changelog_base_sha }}" \
            --head-sha "${{ needs.setup.outputs.head_sha }}" \
            --contributors \
            --repo "${{ github.repository }}")
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" | jq -r '.changelog' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Manage Release
        uses: ./.github/actions/manage-release
        with:
          repo: ${{ github.repository }}
          action: update
          tag: ${{ needs.setup.outputs.version }}
          create_tag: 'true'
          environment: prerelease
          sha: ${{ needs.setup.outputs.head_sha }}
          changelog: ${{ steps.changelog.outputs.changelog }}
          previous_tag: ${{ needs.setup.outputs.previous_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Manifest
        env:
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          MANIFEST_FILE=".github/manifest.yaml"
          MANIFEST_KEY="ci"
          if [[ ! -f "$MANIFEST_FILE" ]]; then
            echo "No $MANIFEST_FILE found - skipping state update"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF##refs/heads/}"
          
          apply_state_edits() {
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # Update state under prerelease key (no environments)
            yq eval -i ".$MANIFEST_KEY.state.prerelease.sha = \"$HEAD_SHA\"" "$MANIFEST_FILE"
            yq eval -i ".$MANIFEST_KEY.state.prerelease.version = \"$VERSION\"" "$MANIFEST_FILE"
            yq eval -i ".$MANIFEST_KEY.state.prerelease.committed_at = \"$TIMESTAMP\"" "$MANIFEST_FILE"
            yq eval -i ".$MANIFEST_KEY.state.prerelease.committed_by = \"${{ github.actor }}\"" "$MANIFEST_FILE"
          }
          
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            apply_state_edits
            if git diff --quiet "$MANIFEST_FILE"; then
              echo "No state changes"
              exit 0
            fi
            git add "$MANIFEST_FILE"
            git commit -m "chore: update state [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed state on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected (likely concurrent run); retrying..." >&2
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::Failed to push state after 5 attempts" >&2
          exit 1
      - name: Check for Failures
        if: needs.validate.result == 'failure' || needs.build-cli.result == 'failure'
        run: |
          echo "One or more critical callbacks failed"
          exit 1
