# Pull Request validation workflow
# Runs unit tests + lint on PRs. E2E runs separately (e2e.yaml) on
# release tags and manual dispatch. Too slow and flaky to run per PR.
#
# This workflow triggers on every PR to main so the PR Gate job always
# reports a status. The expensive jobs (Unit Tests, Lint) are gated on a
# path filter and skip when only docs / non-code files changed. The PR Gate
# job aggregates their results and is the single check to require in branch
# protection: it passes when each gated job succeeds or is skipped, and
# fails when any gated job fails or is cancelled.
name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            code:
              - '!**.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.editorconfig'
              - '!.gitattributes'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: |
          go list ./... | grep -v /e2e \
            | xargs go test -v -race -coverprofile=coverage.out

      - name: Check coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov + 0 < 80) {
              printf "Coverage %s%% is below the 80%% threshold\n", cov
              exit 1
            }
            printf "Coverage %s%% meets the 80%% threshold\n", cov
          }'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

  workflow-drift:
    name: Workflow Drift Check
    runs-on: ubuntu-latest
    # contents:read only. This job runs on pull_request, so a fork PR gets a
    # read-only token and no secrets. It cannot post a PR comment itself; it
    # captures the drift result as an artifact that the drift-comment workflow
    # (workflow_run, base-repo context) consumes with a write token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cascade CLI
        run: go build -o /tmp/cascade ./cmd/cascade

      - name: Check for workflow drift
        run: |
          set +e
          /tmp/cascade verify --config .github/manifest.yaml > drift-report.txt 2>&1
          echo $? > drift-exit.txt
          set -e
          cat drift-report.txt

      - name: Upload drift result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-result
          path: |
            drift-report.txt
            drift-exit.txt
          retention-days: 1

      # Read-only reconcile detector. It records whether a governed action pin
      # moved in a source file so the pin-reconcile companion (workflow_run,
      # base-repo context) can adopt it back into the manifest. This step is
      # advisory: it never fails the PR gate, and the companion recomputes the
      # adoption authoritatively before it writes anything.
      - name: Detect governed pin drift for reconcile
        run: |
          set +e
          /tmp/cascade reconcile --check
          echo "reconcile check exit: $?"
          set -e

      - name: Upload reconcile result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pin-reconcile-result
          path: pin-reconcile-result.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail on drift
        run: |
          CODE=$(cat drift-exit.txt)
          if [ "$CODE" != "0" ]; then
            echo "Workflows are out of sync with the manifest."
            echo "Run: cascade generate-workflow --config .github/manifest.yaml --force"
            echo "Then commit the regenerated workflows."
          fi
          exit "$CODE"

  pr-gate:
    name: PR Gate
    needs: [unit-tests, lint, workflow-drift]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify gated jobs succeeded or were skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required check failed or was cancelled."
            echo "  unit-tests:     ${{ needs.unit-tests.result }}"
            echo "  lint:           ${{ needs.lint.result }}"
            echo "  workflow-drift: ${{ needs.workflow-drift.result }}"
            exit 1
          fi
          echo "PR Gate passed (jobs succeeded or were skipped)."
          echo "  unit-tests:     ${{ needs.unit-tests.result }}"
          echo "  lint:           ${{ needs.lint.result }}"
          echo "  workflow-drift: ${{ needs.workflow-drift.result }}"
