# Pull Request validation workflow
# Runs unit tests + lint on PRs. E2E runs separately (e2e.yaml) on
# release tags and manual dispatch. Too slow and flaky to run per PR.
#
# This workflow triggers on every PR to main so the PR Gate job always
# reports a status. The expensive jobs (Unit Tests, Lint) are gated on a
# path filter and skip when only docs / non-code files changed. The PR Gate
# job aggregates their results and is the single check to require in branch
# protection: it passes when each gated job succeeds or is skipped, and
# fails when any gated job fails or is cancelled.
name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            code:
              - '!**.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.editorconfig'
              - '!.gitattributes'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'
          cache: true

      - name: Run unit tests
        run: |
          go list ./... | grep -v /e2e \
            | xargs go test -v -race -coverprofile=coverage.out

      - name: Check coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d6238b002a20823d52840fda27e2d4891c5952dc # v4
        with:
          version: latest

  workflow-drift:
    name: Workflow Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'
          cache: true

      - name: Build cascade CLI
        run: go build -o /tmp/cascade ./cmd/cascade

      - name: Regenerate dogfood workflows
        run: /tmp/cascade generate-workflow --config .github/manifest.yaml --force

      - name: Verify generated workflows match committed files
        run: |
          if ! git diff --exit-code -- .github/workflows/ .github/actions/; then
            echo "::error::Committed dogfood workflows have drifted from generator output."
            echo "Run 'cascade generate-workflow --config .github/manifest.yaml --force' and commit the result."
            exit 1
          fi
          echo "No drift: committed workflows match generator output."

  pr-gate:
    name: PR Gate
    needs: [unit-tests, lint, workflow-drift]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify gated jobs succeeded or were skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required check failed or was cancelled."
            echo "  unit-tests:     ${{ needs.unit-tests.result }}"
            echo "  lint:           ${{ needs.lint.result }}"
            echo "  workflow-drift: ${{ needs.workflow-drift.result }}"
            exit 1
          fi
          echo "PR Gate passed (jobs succeeded or were skipped)."
          echo "  unit-tests:     ${{ needs.unit-tests.result }}"
          echo "  lint:           ${{ needs.lint.result }}"
          echo "  workflow-drift: ${{ needs.workflow-drift.result }}"
