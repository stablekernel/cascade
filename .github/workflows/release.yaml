name: Release

on:
  # Fires when a tag is pushed via git (e.g. manual hotfix tag or
  # tag-pushed-by-release-action workflows).
  push:
    tags:
      - "v*"
  # Fires when the promote workflow's manage-release step transitions a
  # draft release to non-draft via the GitHub API. API-only releases
  # don't emit `push: tags`, so without this the binaries wouldn't be
  # built and downstream `setup-cli` calls would 404 on assets.
  #
  # Both listed but neither fires reliably from promote-driven API
  # releases (#86). The promote workflow explicitly dispatches via
  # workflow_dispatch instead. Kept as belt-and-suspenders for any
  # future path that creates releases outside the promote flow.
  release:
    types: [published, released]
  # Explicitly triggered by the promote workflow's finalize job after
  # publishing. This is the reliable path; event-based triggers don't
  # fire when releases are managed via API calls in a workflow run.
  workflow_dispatch:

# Least-privilege default: read-only at the top level. Only the release job,
# which cuts the GitHub Release and uploads built assets, is granted write.
permissions:
  contents: read

jobs:
  # Integration protection: because Integration now gates merge to main via branch
  # protection, any commit on main already passed Integration. A tag cut from main
  # is therefore implicitly Integration-validated. We do not re-run Integration
  # here (it would double the ~27min cost); the merge gate is the protection.

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Run tests
        run: go test -v ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import GPG key
        env:
          GPG_KEY_MATERIAL: ${{ secrets.CASCADE_RELEASE_GPG_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$GPG_KEY_MATERIAL" | gpg --batch --import

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GPG_FINGERPRINT: ${{ secrets.CASCADE_RELEASE_GPG_FINGERPRINT }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
          github-token: ${{ secrets.GITHUB_TOKEN }}
