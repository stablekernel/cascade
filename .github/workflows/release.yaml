name: Release

on:
  # Fires when a tag is pushed via git (e.g. manual hotfix tag or
  # tag-pushed-by-release-action workflows).
  push:
    tags:
      - "v*"
  # Fires when the promote workflow's manage-release step transitions a
  # draft release to non-draft via the GitHub API. API-only releases
  # don't emit `push: tags`, so without this the binaries wouldn't be
  # built and downstream `setup-cli` calls would 404 on assets.
  #
  # Both listed but neither fires reliably from promote-driven API
  # releases (#86). The promote workflow explicitly dispatches via
  # workflow_dispatch instead. Kept as belt-and-suspenders for any
  # future path that creates releases outside the promote flow.
  release:
    types: [published, released]
  # Explicitly triggered by the promote workflow's finalize job after
  # publishing. This is the reliable path; event-based triggers don't
  # fire when releases are managed via API calls in a workflow run.
  workflow_dispatch:

# Least-privilege default: read-only at the top level. Only the release job,
# which cuts the GitHub Release and uploads built assets, is granted write.
permissions:
  contents: read

# Single-flight: at most one Release run holds the pipeline at a time. The
# redundant triggers above are deliberate (a pushed candidate tag emits a real
# push event while orchestrate/promote/auto-promote also dispatch explicitly, so
# an API-created or CI-skipped tag still builds), but a pushed tag can fire two
# runs at once. A constant group, not one keyed on the tag, enforces the hard
# invariant that no two releases are ever in flight together. cancel-in-progress
# is false so an active publish always finishes; a queued duplicate then runs and
# no-ops through the idempotency guard in the release job. A pending duplicate can
# be superseded by a newer trigger, which is safe: the release job is idempotent
# and every dispatcher watches its run and can redispatch, so a final publish is
# never silently dropped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Integration protection: because Integration now gates merge to main via branch
  # protection, any commit on main already passed Integration. A tag cut from main
  # is therefore implicitly Integration-validated. We do not re-run Integration
  # here (it would double the ~27min cost); the merge gate is the protection.

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Idempotency guard for the deliberate double-trigger. When a candidate tag
      # is both pushed and dispatched, two Release runs start; the single-flight
      # concurrency group serialises them, and the loser lands here after the
      # winner has published. If a live (non-draft) release with its checksum
      # manifest already exists for this tag, skip the build and no-op green
      # rather than driving GoReleaser into a 422 and leaving a stray draft. The
      # decision core lives in a script so it is unit tested in isolation and
      # reused by the post-GoReleaser belt below.
      - name: Skip if already published
        id: idem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SKIP="$(.github/scripts/release-idempotency.sh "$TAG")"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "::notice::$TAG is already published with its checksum manifest; skipping the build (idempotent no-op)."
          else
            echo "$TAG not yet published; proceeding with the release build."
          fi

      - name: Set up Go
        if: steps.idem.outputs.skip != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        if: steps.idem.outputs.skip != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import GPG key
        if: steps.idem.outputs.skip != 'true'
        env:
          GPG_KEY_MATERIAL: ${{ secrets.CASCADE_RELEASE_GPG_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$GPG_KEY_MATERIAL" | gpg --batch --import

      - name: Install syft
        if: steps.idem.outputs.skip != 'true'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Auto-promote tags the newest candidate's exact commit as the final
      # vX.Y.Z, so a final tag and its last candidate (for example v0.8.0 and
      # v0.8.0-rc.7) share one commit. GoReleaser, given only the current tag,
      # auto-detects the previous tag as that candidate and produces an empty
      # compare range, hence an empty changelog on the final release. For a
      # final tag we pin GORELEASER_PREVIOUS_TAG to the previous stable release
      # so the changelog spans the whole candidate cycle (v0.7.0..v0.8.0). For a
      # candidate or dry-run tag we leave it unset so GoReleaser keeps its
      # existing incremental changelog.
      - name: Resolve previous stable tag for final changelog
        if: steps.idem.outputs.skip != 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          case "$tag" in
            *-rc.*|*-dryrun.*)
              echo "prerelease tag ${tag}; leaving GORELEASER_PREVIOUS_TAG unset"
              ;;
            *)
              git fetch --tags --force
              prev="$(.github/scripts/previous-stable-tag.sh "$tag")"
              if [ -n "$prev" ]; then
                echo "final tag ${tag}; changelog spans ${prev}..${tag}"
                echo "GORELEASER_PREVIOUS_TAG=${prev}" >> "$GITHUB_ENV"
              else
                echo "final tag ${tag}; no previous stable, leaving GORELEASER_PREVIOUS_TAG unset"
              fi
              ;;
          esac

      # continue-on-error tolerates the one benign GoReleaser failure: two runs
      # that both clear the pre-check and publish the same tag at once, so the
      # loser hits `422 already_exists`. The next step converts that specific
      # race into success and fails the job on any other error.
      - name: Run GoReleaser
        id: goreleaser
        if: steps.idem.outputs.skip != 'true'
        continue-on-error: true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ env.GORELEASER_PREVIOUS_TAG }}
          GPG_FINGERPRINT: ${{ secrets.CASCADE_RELEASE_GPG_FINGERPRINT }}

      # Belt for the rare simultaneous double-publish that the pre-check cannot
      # catch: if GoReleaser succeeded we are done; if it failed only because a
      # concurrent run already published this tag with its checksum manifest, the
      # 422 is benign and the job succeeds; any other GoReleaser failure is real
      # and fails the job.
      - name: Confirm release published
        if: steps.idem.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GORELEASER_OUTCOME: ${{ steps.goreleaser.outcome }}
        run: |
          set -euo pipefail
          if [ "$GORELEASER_OUTCOME" = "success" ]; then
            echo "GoReleaser published $TAG."
            exit 0
          fi
          if [ "$(.github/scripts/release-idempotency.sh "$TAG")" = "true" ]; then
            echo "::notice::GoReleaser failed but $TAG is already published by a concurrent run; treating as an idempotent no-op success."
            exit 0
          fi
          echo "::error::GoReleaser failed and no published release exists for $TAG."
          exit 1

      # Skip when the release was already published (idem no-op) or when this run
      # lost the publish race, since only a successful GoReleaser leaves dist/*
      # to attest and the winning run attested its own build.
      - name: Attest build provenance
        if: steps.idem.outputs.skip != 'true' && steps.goreleaser.outcome == 'success'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
          github-token: ${{ secrets.GITHUB_TOKEN }}
